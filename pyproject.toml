[project]
name = "django-environment-config"
version = "0.2.3"
description = "Configure django settings for multiple environments."
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "configuration",
    "settings",
    "environment",
    "env",
    "config",
]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.17",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
cache = ["django-cache-url>=3.4.5"]
db = ["dj-database-url>=2.3.0"]

[project.urls]
"Homepage" = "https://mrthearman.github.io/django-environment-config"
"Repository" = "https://github.com/MrThearMan/django-environment-config"
"Bug Tracker" = "https://github.com/MrThearMan/django-environment-config/issues"
"Documentation" = "https://mrthearman.github.io/django-environment-config"

[project.entry-points.pytest11]
django_environment_config = "env_config_pytest_plugin.hooks"

[dependency-groups]
# Development installs the library with every extra, so that "uv run" needs no
# extra flags and every optional integration is importable.
dev = [
    "django-environment-config[cache,db]",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage==7.16.2",
    "nox==2026.8.17",
]
docs = [
    "zensical==0.0.69",
    "pymdown-extensions==12.1",
    "pygments==2.21.0",
]
lint = [
    "prek==0.5.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "django-stubs==6.1.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# Lets the "dev" group name this project's own extras.
django-environment-config = { workspace = true }

[tool.uv.build-backend]
# The packages are at the repository root, not under "src".
module-root = ""
module-name = [
    "env_config",
    "env_config_pytest_plugin",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
]
exclude = [
    "^tests/",
    "^docs/",
    "^site/",
]

[[tool.mypy.overrides]]
module = "django_cache_url"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "example_project.config.settings"

[tool.coverage.run]
relative_files = true
branch = true
include = [
    "env_config/*",
    "env_config_pytest_plugin/*",
]

[tool.coverage.report]
fail_under = 100
exclude_also = [
    'if TYPE_CHECKING:',
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.config.settings"
addopts = "-vv -s"
filterwarnings = [
    "error",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
